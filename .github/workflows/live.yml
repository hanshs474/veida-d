name: live
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with: { compiler: ldc-latest }
      - run: dub test
      - run: dub run -c cli -- "a paper boat on a calm lake at sunrise, soft light"
